<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NEWS</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('clipinator-theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2" crossorigin="anonymous"></script>
</head>
<body class="headlines-body">
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <strong>NEWS</strong>
      <span class="brand-sub">S&amp;M · P&amp;P · Cement</span>
    </div>
    <nav class="mini-nav">
      <a href="/">Dashboard</a>
      <a href="/clipping">Clipping</a>
      <a href="/sources">Fontes</a>
    </nav>
    <div class="top-actions">
      <span id="hspinner" class="htmx-indicator"><span class="spin-ring"></span></span>
      <button type="button" id="theme-toggle" class="btn-link" aria-pressed="false">Modo escuro</button>
    </div>
  </header>

  <section class="panel">
    <h3>Palavras-chave</h3>
    {% include "_keywords.html" %}
  </section>

  <section id="headlines"
           class="headlines-section"
           hx-get="/headlines/scan"
           hx-trigger="load delay:300ms, every 30s"
           hx-swap="innerHTML"
           hx-indicator="#hspinner">
    {% include "_headlines_list.html" %}
  </section>

  {% include "_reader_modal.html" %}

  <footer class="foot muted">
    <small>Scan leve a cada 30s · janela 72h · Platts · Fastmarkets · Valor · Mining.com · El Financiero.</small>
  </footer>

  <script src="/static/reader.js"></script>
  <script>
    (function () {
      // "há X min" — usado só pelo meta ("último scan há 2 min")
      function formatAge(iso) {
        const then = new Date(iso);
        if (isNaN(then.getTime())) return '';
        const secs = Math.max(0, Math.floor((Date.now() - then.getTime()) / 1000));
        if (secs < 60) return 'agora';
        if (secs < 3600) return 'há ' + Math.floor(secs / 60) + ' min';
        if (secs < 86400) return 'há ' + Math.floor(secs / 3600) + ' h';
        return 'há ' + Math.floor(secs / 86400) + ' d';
      }
      // "HH:MM" local — o server envia UTC via strftime, JS converte pro fuso do browser.
      function formatTimeLocal(iso) {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        return hh + ':' + mm;
      }
      function updateAges() {
        document.querySelectorAll('time.age[datetime], time.hage[datetime]').forEach(el => {
          el.textContent = formatAge(el.getAttribute('datetime'));
        });
      }
      function updateExactTimes() {
        document.querySelectorAll('time.time-exact[datetime]').forEach(el => {
          el.textContent = formatTimeLocal(el.getAttribute('datetime'));
        });
      }

      // Rastreia URLs ja vistas para detectar novas manchetes apos cada swap.
      const seen = new Set();
      function seedSeen() {
        document.querySelectorAll('li.headline[data-url]').forEach(el => {
          seen.add(el.getAttribute('data-url'));
        });
      }
      function flashNew() {
        document.querySelectorAll('li.headline[data-url]').forEach(el => {
          const url = el.getAttribute('data-url');
          if (!seen.has(url)) {
            seen.add(url);
            el.classList.add('just-arrived');
            setTimeout(() => el.classList.remove('just-arrived'), 3400);
          }
        });
      }

      updateAges();
      updateExactTimes();
      seedSeen();
      setInterval(updateAges, 15000);
      // HH:MM e imutavel — so roda no load e depois de cada swap HTMX.
      document.body.addEventListener('htmx:afterSwap', () => {
        updateAges();
        updateExactTimes();
        flashNew();
      });
    })();

    (function () {
      const STORAGE_KEY = 'clipinator-theme';
      const btn = document.getElementById('theme-toggle');
      if (!btn) return;
      function apply(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        btn.textContent = theme === 'dark' ? 'Modo claro' : 'Modo escuro';
        btn.setAttribute('aria-pressed', String(theme === 'dark'));
      }
      apply(document.documentElement.getAttribute('data-theme') || 'light');
      btn.addEventListener('click', () => {
        const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem(STORAGE_KEY, next); } catch (e) {}
        apply(next);
      });
    })();
  </script>
</body>
</html>
