name: News Sync — Fast (5 min)
# Roda a cada 5 minutos. Coleta RSS + requests (sem Playwright/Chromium).
# Fontes: Mining.com, World Cement, El Financiero.
# Minutos GitHub Actions por mês: ~288 runs/dia × ~0.5 min = ~4.320 min/mês.

on:
  # Sync para o Supabase DESLIGADA (2026-06-10): o news-hunter (repo separado) é o
  # ÚNICO alimentador da tabela news_articles do web dashboard. Cron removido para
  # não rodar à toa (push_new vira no-op sem CLIPINATOR_SUPABASE_SYNC=1).
  # workflow_dispatch mantido para execução manual caso a sync seja reativada.
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4   # mata se travar (proteção anti-sobreposição)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fast sync
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python sync_runner.py --fast
